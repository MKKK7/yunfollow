version: '3.8'
services:
  reelay-fnos:
    image: reelay-fnos:0.2.4
    container_name: reelay-fnos
    restart: always
    ports:
      - '${FNOS_BIND_ADDRESS:-127.0.0.1}:28080:28080'
    env_file:
      - /vol1/1000/AppData/Reelay-FNOS/integration.env
    volumes:
      - /vol1/1000/AppData/Reelay-FNOS/data:/app/data
      - /vol1/1000/StrmLink/litePan:/app/strm:ro
      - /vol1/1000/AppData/Reelay-FNOS/kdocs:/home/reelay/.config/kdocs-cli
    environment:
      - TZ=Asia/Shanghai
      - FNOS_BOT_API=1
    stop_grace_period: 25s
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
