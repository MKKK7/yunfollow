name: Build YunFollow image manually
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build
        working-directory: web
      - run: docker build -f Dockerfile.yunfollow -t yunfollow:manual .
      - run: docker run --rm yunfollow:manual python -m reelay.main --dry-run