name: FNOS minimal checks
on:
  push:
    branches: [fnos-minimal]
  pull_request:
    branches: [fnos-minimal]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -e '.[web,dev]'
      - run: python -m unittest tests.test_fnos tests.test_fnos_sources -v
      - run: node --test tests/fnos_adapters.test.mjs
