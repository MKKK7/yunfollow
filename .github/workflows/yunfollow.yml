name: YunFollow checks
on:
  push:
    branches: [main, fnos-minimal]
  pull_request:
    branches: [main, fnos-minimal]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -e '.[web,dev]'
      - run: python -m unittest tests.test_fnos tests.test_fnos_sources tests.test_yunfollow tests.test_yunfollow_offline tests.test_conversation -v
      - run: node --test tests/fnos_adapters.test.mjs
      - run: npm ci && npm run typecheck && npm run lint:eslint && npm run test && npm run build
        working-directory: web
