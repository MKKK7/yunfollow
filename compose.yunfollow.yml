services:
  yunfollow:
    image: yunfollow:0.3.0
    container_name: yunfollow
    restart: always
    ports:
      - '${YUNFOLLOW_BIND_ADDRESS:-127.0.0.1}:28080:28080'
    env_file:
      - /vol1/1000/AppData/YunFollow/integration.env
    volumes:
      - /vol1/1000/AppData/YunFollow/data:/app/data
      - /vol1/1000/StrmLink/litePan:/app/strm:ro
      - /vol1/1000/AppData/YunFollow/kdocs:/home/reelay/.config/kdocs-cli
    environment:
      - TZ=Asia/Shanghai
      - FNOS_BOT_API=1
    stop_grace_period: 25s
    mem_limit: 768m
    cpus: 1.5
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
